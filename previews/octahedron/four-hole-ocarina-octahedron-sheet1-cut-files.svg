<svg xmlns="http://www.w3.org/2000/svg" width="596.82mm" height="174.77mm" viewBox="0 0 596.82 174.77">
<!-- DISPLAY ONLY - not a cut file.
     The stroke is thickened, a light ground painted in, and the lightest inks
     darkened: green, cyan and orange sit below the 3:1 graphics minimum against any
     light background, so the cut order cannot be read from a faithful rendering. Hue
     and sequence are unchanged. Geometry and sheet position are untouched, and the
     CUT FILE keeps the exact values your laser keys on.
     Cut the file in the repository root, not this one. -->
  <rect x="0.0" y="0.0" width="596.82" height="174.77" fill="#ffffff"/>
<title>Four-hole ocarina in D4, octahedron, sheet 1 of 1</title>
<desc>1 user unit = 1mm. Four-hole ocarina in D4, English fingering, octahedron, sheet 1 of 1: bird, bottom, chin layer, mouth triangle, top plate, triangle. 3mm ply, drawn for a 0.13mm kerf. The duct is a fill engrave in two inks, run either or both: red #ff0000 in the bird's underside, magenta #ff00ff in the top's outside face. One alone about 1mm deep, both about 0.5mm each -- set the depth on scrap first. Blue #0000ff engraves single lines: on the top, which lies outside face up, a line across past the window where the 30 degree bevel filed on its far edge should reach; on every other plate, inside face up, the corner numbers, each carried by the plates that meet at that corner. Then the cuts: orange #ff8000 cuts the window and the holes, and black #000000 frees the parts.</desc>
