<title>Four-hole ocarina in G4, square-antiprism, sheet 1 of 1</title>
<desc>1 user unit = 1mm. Four-hole ocarina in G4, English fingering, square-antiprism, sheet 1 of 1: bird, bottom, chin layer, mouth triangle, top plate, triangle. 3mm ply, drawn for a 0.13mm kerf. Blue #0000ff engraves the duct, a fill engrave about 1mm deep -- set the depth on scrap first; orange #ff8000 cuts the window, the holes; black #000000 frees the parts.</desc>
