<title>The box's top plate from outside, to scale</title>
<desc>Display drawing, not a cut file. The top plate from outside, to scale, beak on the left: the bird's footprint dashed, the duct under it in magenta, the nest's half engraved in this face and the bird's matching it above, the window, the four finger holes named for their fingers with their diameters, and the cavity's walls dotted beneath. The right hand's holes are at the bottom of the drawing: the player sees the other face.</desc>
