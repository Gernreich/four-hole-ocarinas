<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 101 83">
<title>The cube's top plate from outside, to scale</title>
<desc>Display drawing, not a cut file. The cube's top plate from outside, to scale, beak on the left, its edges cut into fingers: the bird's footprint dashed, the duct under it in magenta, the nest's half engraved in this face and the bird's matching it above, the window, the four finger holes named for their fingers with their diameters, the blue line past the window that marks where the splitting edge's bevel should reach, and the cavity's walls dotted beneath. The right hand's holes are at the bottom of the drawing: the player sees the other face.</desc>
