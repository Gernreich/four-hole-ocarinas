<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="588.24mm" height="142.26mm" viewBox="0 0 588.24 142.26">
<title>Four-hole ocarina in D4, hexagonal-prism, sheet 1 of 1</title>
<desc>1 user unit = 1mm. Four-hole ocarina in D4, English fingering, hexagonal-prism, sheet 1 of 1: bird, bottom, chin layer, mouth wall, top plate, wall. 3mm ply, drawn for a 0.13mm kerf. The duct is a fill engrave in two inks, run either or both: red #ff0000 in the bird's underside, magenta #ff00ff in the top's outside face. One alone about 1mm deep, both about 0.5mm each -- set the depth on scrap first. Blue #0000ff engraves the corner numbers, as single lines: the plates lie inside face up, so they mark the inside, and the plates that meet at a corner carry its number; the top, outside face up, has none. Then the cuts: orange #ff8000 cuts the window and the holes, and black #000000 frees the parts.</desc>
