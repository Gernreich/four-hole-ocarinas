<svg xmlns="http://www.w3.org/2000/svg" width="597.76mm" height="217.05mm" viewBox="0 0 597.76 217.05">
<title>Four-hole ocarina in G4, truncated-cube, sheet 1 of 1</title>
<desc>1 user unit = 1mm. Four-hole ocarina in G4, English fingering, truncated-cube, sheet 1 of 1: bird, chin layer, mouth octagon, octagon, top plate, triangle. 3mm ply, drawn for a 0.13mm kerf. Blue #0000ff engraves the duct, a fill engrave about 1mm deep -- set the depth on scrap first; orange #ff8000 cuts the window, the holes; black #000000 frees the parts.</desc>
