<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="553.38mm" height="234.39mm" viewBox="0 0 553.38 234.39">
<title>Four-hole ocarina in G4, stack, sheet 1 of 1</title>
<desc>1 user unit = 1mm. Four-hole ocarina in G4, English fingering, stack, sheet 1 of 1: bird, bottom layer, chin layer, frame layer, top plate. 3mm ply, drawn for a 0.13mm kerf. The duct is a fill engrave in two inks, run either or both: red #ff0000 in the bird's underside, magenta #ff00ff in the top's outside face. One alone about 1mm deep, both about 0.5mm each -- set the depth on scrap first. Then the cuts: orange #ff8000 cuts the window, the holes and the cavity, and black #000000 frees the parts.</desc>
