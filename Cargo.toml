[package]
name = "four-hole-ocarinas"
version = "0.1.0"
edition = "2021"
authors = ["Michael Gernreich", "Claude (Anthropic) <noreply@anthropic.com>"]
description = "Four-hole ocarinas as finger-jointed solids, cut files and page"
license-file = "LICENSE"
publish = false
autobins = false

# The generators, and a library the Rust generators beside this checkout
# (panpipes, practice-chanters, ghb-chanter, uilleann-chanter) depend on by
# path for the mitred offset and polyhedron.rs's solid.
[lib]
name = "four_hole_ocarinas"
path = "four_hole_ocarinas.rs"

[[bin]]
name = "four_hole_ocarinas"
path = "bin/four_hole_ocarinas.rs"

[[bin]]
name = "ocarina_model"
path = "bin/ocarina_model.rs"

[[bin]]
name = "page_assets"
path = "bin/page_assets.rs"

[[bin]]
name = "solid_survey"
path = "bin/solid_survey.rs"

[dependencies]
lasermade-tools = { path = "../lasermade-tools" }
square-flute = { path = "../square-flute" }
swept-curve = { path = "../swept-curve" }
